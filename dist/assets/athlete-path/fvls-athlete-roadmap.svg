<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 1120" role="img" aria-labelledby="roadmap-title roadmap-desc">
  <title id="roadmap-title">Путь спортсмена ФВЛС</title>
  <desc id="roadmap-desc">Фирменная инфографика ФВЛС Москвы: от школы и первого старта до разрядов, сборной, международного, коммерческого, судейского и тренерского путей.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#092137"/><stop offset=".58" stop-color="#0d2b42"/><stop offset="1" stop-color="#07192b"/></linearGradient>
    <radialGradient id="glow" cx="78%" cy="0" r="68%"><stop stop-color="#1d5269" stop-opacity=".72"/><stop offset="1" stop-color="#1d5269" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#63d3e3" stop-opacity=".25"/><stop offset=".2" stop-color="#63d3e3"/><stop offset=".8" stop-color="#63d3e3"/><stop offset="1" stop-color="#63d3e3" stop-opacity=".25"/></linearGradient>
    <style>
      @font-face { font-family: Manrope; src: url('../manrope-cyrillic.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
      .title { fill:#fff; font:700 64px Manrope,Arial,sans-serif; letter-spacing:-2px }
      .eyebrow { fill:#8eeaf5; font:600 20px Manrope,Arial,sans-serif; letter-spacing:2px }
      .lead { fill:#d9eef4; font:400 26px Manrope,Arial,sans-serif }
      .card { fill:#12354d; stroke:#45798e; stroke-width:2 }
      .card-soft { fill:#0e2a40; stroke:#345f76; stroke-width:2 }
      .route { fill:#12354d; stroke:#63d3e3; stroke-width:2 }
      .step { fill:#8eeaf5; font:600 19px Manrope,Arial,sans-serif; letter-spacing:1px }
      .heading { fill:#fff; font:600 34px Manrope,Arial,sans-serif; letter-spacing:-1px }
      .body { fill:#d4e9ef; font:500 27px Manrope,Arial,sans-serif }
      .body-small { fill:#b9dbe5; font:500 27px Manrope,Arial,sans-serif }
      .route-title { fill:#8eeaf5; font:600 34px Manrope,Arial,sans-serif; letter-spacing:-1px }
      .route-body { fill:#edf9fc; font:500 28px Manrope,Arial,sans-serif }
      .tiny { fill:#aed5df; font:500 24px Manrope,Arial,sans-serif }
      .line { fill:none; stroke:url(#line); stroke-width:4; stroke-linecap:round }
      .thin { fill:none; stroke:#63d3e3; stroke-width:3; stroke-linecap:round; stroke-linejoin:round }
    </style>
  </defs>
  <rect width="1980" height="1120" fill="url(#bg)"/>
  <rect width="1980" height="1120" fill="url(#glow)"/>
  <path d="M0 1080C330 940 580 1180 955 1028s640-14 1025-185v277H0z" fill="#0a2034" opacity=".66"/>

  <text class="eyebrow" x="76" y="78">ФВЛС МОСКВЫ · КАРТА ВОЗМОЖНОСТЕЙ</text>
  <text class="title" x="76" y="145">Путь спортсмена ФВЛС</text>
  <text class="lead" x="76" y="190">Спортивный результат, профессиональный рост и партнёрства на одной карте.</text>
  <g transform="translate(1590 72)">
    <rect width="300" height="74" rx="37" fill="#0e3850" stroke="#63d3e3" stroke-width="2"/>
    <circle cx="42" cy="37" r="17" fill="none" stroke="#63d3e3" stroke-width="4"/><path class="thin" d="M33 38l7 7 13-16"/>
    <text class="body-small" x="78" y="33">Brisbane 2032</text><text class="tiny" x="78" y="57">стратегическая цель</text>
  </g>

  <path class="line" d="M153 455H1827"/>
  <g fill="#63d3e3"><circle cx="235" cy="455" r="8"/><circle cx="600" cy="455" r="8"/><circle cx="965" cy="455" r="8"/><circle cx="1330" cy="455" r="8"/><circle cx="1695" cy="455" r="8"/></g>

  <g transform="translate(76 235)">
    <rect class="card" width="318" height="174" rx="22"/>
    <circle cx="40" cy="40" r="23" fill="#63d3e3"/><text x="40" y="47" text-anchor="middle" fill="#082036" font-family="Manrope,Arial,sans-serif" font-size="25" font-weight="800">1</text>
    <text class="step" x="78" y="37">СТАРТ</text><text class="heading" x="26" y="92">Школа ФВЛС</text>
    <text class="body-small" x="26" y="137">Обучение · дисциплина</text>
  </g>
  <g transform="translate(441 235)">
    <rect class="card" width="318" height="174" rx="22"/>
    <circle cx="40" cy="40" r="23" fill="#63d3e3"/><text x="40" y="47" text-anchor="middle" fill="#082036" font-family="Manrope,Arial,sans-serif" font-size="25" font-weight="800">2</text>
    <text class="step" x="78" y="37">U15</text><text class="heading" x="26" y="92">Первый старт</text>
    <text class="body-small" x="26" y="137">II–I юношеские</text>
  </g>
  <g transform="translate(806 235)">
    <rect class="card" width="318" height="174" rx="22"/>
    <circle cx="40" cy="40" r="23" fill="#63d3e3"/><text x="40" y="47" text-anchor="middle" fill="#082036" font-family="Manrope,Arial,sans-serif" font-size="25" font-weight="800">3</text>
    <text class="step" x="78" y="37">U19 · OPEN</text><text class="heading" x="26" y="92">Разряды и КМС</text>
    <text class="body-small" x="26" y="137">III–I разряды → КМС</text>
  </g>
  <g transform="translate(1171 235)">
    <rect class="card" width="318" height="174" rx="22"/>
    <circle cx="40" cy="40" r="23" fill="#63d3e3"/><text x="40" y="47" text-anchor="middle" fill="#082036" font-family="Manrope,Arial,sans-serif" font-size="25" font-weight="800">4</text>
    <text class="step" x="78" y="37">OPEN</text><text class="heading" x="26" y="92">МС и сборная</text>
    <text class="body-small" x="26" y="137">Россия и сборная</text>
  </g>
  <g transform="translate(1536 235)">
    <rect class="card" width="368" height="174" rx="22"/>
    <circle cx="40" cy="40" r="23" fill="#63d3e3"/><text x="40" y="47" text-anchor="middle" fill="#082036" font-family="Manrope,Arial,sans-serif" font-size="25" font-weight="800">5</text>
    <text class="step" x="78" y="37">MASTERS · VETERANS</text><text class="heading" x="26" y="92">Международный уровень</text>
    <text class="body-small" x="26" y="137">МСМК · Европа · мир</text>
  </g>

  <g transform="translate(76 505)">
    <rect class="card-soft" width="1828" height="148" rx="22"/>
    <text class="route-title" x="30" y="46">Спортивная квалификация</text>
    <text class="route-body" x="30" y="94">II–I юношеские</text><path class="thin" d="M286 85h46m-15-13 15 13-15 13"/>
    <text class="route-body" x="358" y="94">III–I разряды</text><path class="thin" d="M570 85h46m-15-13 15 13-15 13"/>
    <text class="route-body" x="642" y="94">КМС</text><path class="thin" d="M716 85h46m-15-13 15 13-15 13"/>
    <text class="route-body" x="791" y="94">МС</text><path class="thin" d="M852 85h46m-15-13 15 13-15 13"/>
    <text class="route-body" x="926" y="94">МСМК</text><path class="thin" d="M1016 85h46m-15-13 15 13-15 13"/>
    <text class="route-body" x="1090" y="94">сборная</text><path class="thin" d="M1205 85h46m-15-13 15 13-15 13"/>
    <text class="route-body" x="1275" y="94">Европа и мир</text>
    <text class="tiny" x="30" y="126">Город → субъект РФ → межрегиональные старты → Россия → международные соревнования</text>
  </g>

  <g transform="translate(76 710)">
    <rect class="route" width="570" height="238" rx="24"/>
    <circle cx="47" cy="48" r="21" fill="none" stroke="#63d3e3" stroke-width="4"/><path class="thin" d="M38 48h18m-9-9v18"/>
    <text class="route-title" x="84" y="58">Коммерческий путь</text>
    <text class="route-body" x="30" y="110">Партнёрская программа и бартер</text>
    <text class="route-body" x="30" y="151">Контент, личный бренд, CTA</text>
    <text class="route-body" x="30" y="192">Гонорар, экипировка, бонусы</text>
  </g>
  <g transform="translate(705 710)">
    <rect class="route" width="570" height="238" rx="24"/>
    <path class="thin" d="M32 36h28l9 14-9 14H32l-9-14z"/><text class="route-title" x="84" y="58">Судейский путь</text>
    <text class="route-body" x="30" y="110">Судья III категории → II → I</text>
    <text class="route-body" x="30" y="151">Всероссийская категория</text>
    <text class="route-body" x="30" y="192">Международная судейская практика</text>
  </g>
  <g transform="translate(1334 710)">
    <rect class="route" width="570" height="238" rx="24"/>
    <path class="thin" d="M37 35l26-11 26 11-26 12zM46 42v18h34V42"/><text class="route-title" x="105" y="58">Тренерский путь</text>
    <text class="route-body" x="30" y="110">Тренер → II → I → высшая</text>
    <text class="route-body" x="30" y="151">Старший тренер и тренер сборной</text>
    <text class="route-body" x="30" y="192">Заслуженный тренер России</text>
  </g>

  <g transform="translate(76 992)">
    <rect fill="#0c2940" stroke="#45798e" stroke-width="2" width="1828" height="72" rx="20"/>
    <circle cx="38" cy="36" r="19" fill="#63d3e3"/><path d="m30 37 6 6 12-15" fill="none" stroke="#082036" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="body-small" x="78" y="31">Поддержка и признание</text>
    <text class="tiny" x="78" y="55">Почётный мастер спорта · Медаль Николая Озерова · Орден Почёта · меры поддержки и выплаты — по действующим условиям</text>
  </g>
</svg>
