<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 990" role="img" aria-labelledby="roadmap-title roadmap-desc">
  <title id="roadmap-title">Путь спортсмена ФВЛС</title>
  <desc id="roadmap-desc">Инфографика пути спортсмена от школы ФВЛС до международных стартов, личного бренда, судейского и тренерского направлений.</desc>
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
    </filter>
    <filter id="chalk"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="9" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.15" xChannelSelector="R" yChannelSelector="G"/></filter>
    <style>
      .chalk { fill:#f7f4ee; stroke:#f7f4ee; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; filter:url(#chalk) }
      .fine { fill:none; stroke:#f7f4ee; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; filter:url(#chalk) }
      .aqua { fill:#5bd4e7; stroke:#5bd4e7; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; filter:url(#chalk) }
      .aqua-line { fill:none; stroke:#5bd4e7; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; filter:url(#chalk) }
      .yellow { fill:#ffd525; stroke:#ffd525; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; filter:url(#chalk) }
      .yellow-line { fill:none; stroke:#ffd525; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; filter:url(#chalk) }
      .title { font:italic 800 52px 'Segoe Print','Comic Sans MS',cursive; letter-spacing:2px }
      .subtitle { font:italic 700 28px 'Segoe Print','Comic Sans MS',cursive }
      .label { font:700 23px 'Segoe Print','Comic Sans MS',cursive }
      .small { font:600 18px 'Segoe Print','Comic Sans MS',cursive }
      .micro { font:600 15px 'Segoe Print','Comic Sans MS',cursive }
      .node { fill:#111920; stroke:#ffd525; stroke-width:3; rx:18 }
      .tick { fill:#ffd525; stroke:#ffd525; stroke-width:2 }
    </style>
    <g id="medal">
      <path class="fine" d="M-18 -24h36l-7 22H-11z"/><circle class="yellow-line" cy="9" r="15"/><path class="yellow" d="m0 -1 4 7 8 1-6 6 2 9-8-4-8 4 2-9-6-6 8-1z"/>
    </g>
    <g id="skier">
      <circle class="fine" cx="0" cy="-19" r="7"/><path class="fine" d="M0-12l-8 20 15 8m-9-15 18 9 12-10M-9 8l-18 21m29-13 20 17"/><path class="aqua-line" d="M-34 31q32 8 67 0"/>
    </g>
    <g id="laurel"><path class="yellow-line" d="M-18 21C-39 7-38-22-22-33m44 54C39 7 38-22 22-33"/><path class="yellow" d="m-25-20 10 7-8 5m2 14 12 3-5 8m34-37-10 7 8 5m-2 14-12 3 5 8"/></g>
    <g id="check"><rect class="fine" x="-10" y="-10" width="20" height="20" rx="2"/><path class="yellow-line" d="m-6 0 5 5 10-12"/></g>
  </defs>
