<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 2020" role="img" aria-labelledby="mobile-title mobile-desc">
  <title id="mobile-title">Путь спортсмена ФВЛС</title>
  <desc id="mobile-desc">Вертикальная версия карты пути спортсмена ФВЛС Москвы с крупной типографикой для телефона.</desc>
  <defs>
    <linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#092137"/><stop offset="1" stop-color="#0b2c42"/></linearGradient>
    <style>
      @font-face { font-family: Manrope; src: url('../manrope-cyrillic.woff2') format('woff2'); font-weight: 200 800; font-display: swap; }
      .title { fill:#fff; font:700 48px Manrope,Arial,sans-serif; letter-spacing:-1.8px }
      .eyebrow { fill:#8eeaf5; font:600 16px Manrope,Arial,sans-serif; letter-spacing:1.6px }
      .lead { fill:#d9eef4; font:400 22px Manrope,Arial,sans-serif }
      .card { fill:#12354d; stroke:#45798e; stroke-width:2 }
      .route { fill:#103149; stroke:#63d3e3; stroke-width:2 }
      .step { fill:#8eeaf5; font:600 17px Manrope,Arial,sans-serif; letter-spacing:1px }
      .heading { fill:#fff; font:600 30px Manrope,Arial,sans-serif; letter-spacing:-.8px }
      .body { fill:#d4e9ef; font:500 25px Manrope,Arial,sans-serif }
      .small { fill:#b9dbe5; font:500 21px Manrope,Arial,sans-serif }
      .route-title { fill:#8eeaf5; font:600 30px Manrope,Arial,sans-serif; letter-spacing:-.8px }
      .line { fill:none; stroke:#63d3e3; stroke-width:3; stroke-linecap:round }
    </style>
  </defs>
  <rect width="720" height="2020" fill="url(#bgm)"/>
  <circle cx="650" cy="90" r="260" fill="#1d5269" opacity=".42"/>
  <text class="eyebrow" x="50" y="55">ФВЛС МОСКВЫ · КАРТА ВОЗМОЖНОСТЕЙ</text>
  <text class="title" x="50" y="113">Путь спортсмена ФВЛС</text>
  <text class="lead" x="50" y="151">Спорт, профессия и партнёрства.</text>
  <rect x="50" y="178" width="620" height="56" rx="28" fill="#0e3850" stroke="#63d3e3" stroke-width="2"/>
  <text class="small" x="76" y="214">Brisbane 2032 — стратегическая цель</text>

  <path class="line" d="M82 305V930"/>
  <g transform="translate(118 264)"><rect class="card" width="552" height="132" rx="20"/><circle cx="36" cy="37" r="22" fill="#63d3e3"/><text x="36" y="44" text-anchor="middle" fill="#082036" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800">1</text><text class="step" x="74" y="35">СТАРТ</text><text class="heading" x="28" y="79">Школа ФВЛС</text><text class="small" x="28" y="112">Обучение, команда и выбор дисциплины</text></g>
  <g transform="translate(118 418)"><rect class="card" width="552" height="132" rx="20"/><circle cx="36" cy="37" r="22" fill="#63d3e3"/><text x="36" y="44" text-anchor="middle" fill="#082036" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800">2</text><text class="step" x="74" y="35">U15</text><text class="heading" x="28" y="79">Первый старт</text><text class="small" x="28" y="112">II–I юношеские разряды</text></g>
  <g transform="translate(118 572)"><rect class="card" width="552" height="132" rx="20"/><circle cx="36" cy="37" r="22" fill="#63d3e3"/><text x="36" y="44" text-anchor="middle" fill="#082036" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800">3</text><text class="step" x="74" y="35">U19 · OPEN</text><text class="heading" x="28" y="79">Разряды и КМС</text><text class="small" x="28" y="112">III–I разряды · КМС · ЕКП</text></g>
  <g transform="translate(118 726)"><rect class="card" width="552" height="132" rx="20"/><circle cx="36" cy="37" r="22" fill="#63d3e3"/><text x="36" y="44" text-anchor="middle" fill="#082036" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800">4</text><text class="step" x="74" y="35">OPEN</text><text class="heading" x="28" y="79">МС и сборная</text><text class="small" x="28" y="112">Кубок и чемпионат России</text></g>
  <g transform="translate(118 880)"><rect class="card" width="552" height="132" rx="20"/><circle cx="36" cy="37" r="22" fill="#63d3e3"/><text x="36" y="44" text-anchor="middle" fill="#082036" font-family="Manrope,Arial,sans-serif" font-size="24" font-weight="800">5</text><text class="step" x="74" y="35">MASTERS · VETERANS</text><text class="heading" x="28" y="79">Международный уровень</text><text class="small" x="28" y="112">МСМК · Европа, мир, Всемирные игры</text></g>

  <g transform="translate(50 1062)"><rect class="route" width="620" height="142" rx="20"/><text class="route-title" x="28" y="43">Спортивная квалификация</text><text class="body" x="28" y="85">II–I юн. → III–I → КМС → МС → МСМК</text><text class="small" x="28" y="119">Город → регион → Россия → международные старты</text></g>
  <g transform="translate(50 1226)"><rect class="route" width="620" height="156" rx="20"/><text class="route-title" x="28" y="43">Коммерческий путь</text><text class="body" x="28" y="85">Партнёры и бартер · личный бренд</text><text class="small" x="28" y="121">Контент, CTA, гонорар, экипировка, бонусы</text></g>
  <g transform="translate(50 1404)"><rect class="route" width="620" height="156" rx="20"/><text class="route-title" x="28" y="43">Судейский путь</text><text class="body" x="28" y="85">III категория → II → I</text><text class="small" x="28" y="121">Всероссийская и международная практика</text></g>
  <g transform="translate(50 1582)"><rect class="route" width="620" height="156" rx="20"/><text class="route-title" x="28" y="43">Тренерский путь</text><text class="body" x="28" y="85">Тренер → II → I → высшая</text><text class="small" x="28" y="121">Старший тренер, сборная, заслуженный тренер</text></g>
  <g transform="translate(50 1780)"><rect x="0" y="0" width="620" height="160" rx="20" fill="#0c2940" stroke="#45798e" stroke-width="2"/><circle cx="37" cy="39" r="19" fill="#63d3e3"/><path d="m29 39 6 6 12-15" fill="none" stroke="#082036" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text class="route-title" x="76" y="45">Поддержка и признание</text><text class="body" x="28" y="91">Почётный мастер спорта</text><text class="small" x="28" y="124">Медаль Николая Озерова · Орден Почёта</text></g>
</svg>
