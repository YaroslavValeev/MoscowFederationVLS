server {
    listen 8080 default_server;
    server_name fvls.mywavewake.ru;
    root /srv/fvls;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    location = /school {
        add_header Cache-Control "no-cache";
        try_files /school.html =404;
    }

    location = /school/ {
        return 308 /school$is_args$args;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }
}
